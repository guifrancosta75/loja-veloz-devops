# Ambiente local completo com UM comando:  docker compose up --build -d
name: loja-veloz

x-service: &service
  restart: unless-stopped
  networks: [backend]
  environment: &common-env
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

services:
  gateway:
    <<: *service
    build:
      context: ./services
      args: { SERVICE: gateway, PORT: "8080", VERSION: "${IMAGE_VERSION:-local}" }
    image: loja-veloz/gateway:${IMAGE_VERSION:-local}
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: gateway
      PEDIDOS_URL: http://pedidos:3001
    ports: ["8080:8080"]          # única porta exposta ao host
    networks: [frontend, backend]
    depends_on: [pedidos]

  pedidos:
    <<: *service
    build:
      context: ./services
      args: { SERVICE: pedidos, PORT: "3001", VERSION: "${IMAGE_VERSION:-local}" }
    image: loja-veloz/pedidos:${IMAGE_VERSION:-local}
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: pedidos
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ESTOQUE_URL: http://estoque:3003
      PAGAMENTOS_URL: http://pagamentos:3002
    depends_on:
      postgres: { condition: service_healthy }
      estoque: { condition: service_started }
      pagamentos: { condition: service_started }

  pagamentos:
    <<: *service
    build:
      context: ./services
      args: { SERVICE: pagamentos, PORT: "3002", VERSION: "${IMAGE_VERSION:-local}" }
    image: loja-veloz/pagamentos:${IMAGE_VERSION:-local}
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: pagamentos
      PAYMENT_PROVIDER_API_KEY: ${PAYMENT_PROVIDER_API_KEY}
      PAGAMENTO_FALHA_PERCENT: ${PAGAMENTO_FALHA_PERCENT:-0}

  estoque:
    <<: *service
    build:
      context: ./services
      args: { SERVICE: estoque, PORT: "3003", VERSION: "${IMAGE_VERSION:-local}" }
    image: loja-veloz/estoque:${IMAGE_VERSION:-local}
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: estoque
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Observabilidade ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    networks: [backend]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.58
    networks: [backend]
    ports: ["16686:16686"]        # UI de traces

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    networks: [backend]
    ports: ["9090:9090"]          # UI de métricas

networks:
  frontend:
  backend:

volumes:
  pgdata:
