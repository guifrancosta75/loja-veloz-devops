# EXEMPLO - NÃO é aplicado pelo kustomize e NÃO deve conter valores reais.
# O Secret real é criado pelo pipeline (a partir de GitHub Secrets) ou por um gerenciador
# (External Secrets Operator / Sealed Secrets / Vault). Local:
#
#   kubectl -n loja-veloz create secret generic loja-veloz-secrets \
#     --from-literal=POSTGRES_USER=veloz \
#     --from-literal=POSTGRES_PASSWORD='<senha-forte>' \
#     --from-literal=DATABASE_URL='postgres://veloz:<senha-forte>@postgres:5432/pedidos' \
#     --from-literal=PAYMENT_PROVIDER_API_KEY='<chave>'
apiVersion: v1
kind: Secret
metadata: { name: loja-veloz-secrets }
type: Opaque
stringData:
  POSTGRES_USER: veloz
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgres://veloz:CHANGE_ME@postgres:5432/pedidos
  PAYMENT_PROVIDER_API_KEY: CHANGE_ME
