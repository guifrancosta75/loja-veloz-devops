apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loja-veloz
resources:
  - namespace.yaml
  - postgres.yaml
  - gateway.yaml
  - pedidos.yaml
  - pagamentos.yaml
  - estoque.yaml
  - networkpolicy.yaml
  - ingress.yaml
configMapGenerator:
  # Configuração não-sensível (12-factor III). Mudou o conteúdo => hash muda => rollout automático.
  - name: loja-veloz-config
    literals:
      - PEDIDOS_URL=http://pedidos:3001
      - ESTOQUE_URL=http://estoque:3003
      - PAGAMENTOS_URL=http://pagamentos:3002
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability.svc:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - PAGAMENTO_FALHA_PERCENT=0
  - name: postgres-init
    files:
      - init.sql=init.sql
