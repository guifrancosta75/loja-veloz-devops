name: ci-cd

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # 1) Lint + testes unitários
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # 2) Validação estática de Dockerfile e manifests K8s (gate antes do build)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint do Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/Dockerfile
      - name: init.sql do K8s em sincronia com o do Compose
        run: diff sql/init.sql k8s/base/init.sql
      - name: Validar manifests (kustomize + kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize k8s/overlays/prod | ./kubeconform -strict -summary -ignore-missing-schemas
      - uses: hashicorp/setup-terraform@v3
      - name: Validar Terraform (init sem backend + validate)
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

  # 3) Build, scan (Trivy) e publicação das 4 imagens no GHCR
  build-push:
    needs: [test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: gateway, port: 8080 }
          - { service: pedidos, port: 3001 }
          - { service: pagamentos, port: 3002 }
          - { service: estoque, port: 3003 }
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/loja-veloz-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (local, para scan)
        uses: docker/build-push-action@v6
        with:
          context: services
          load: true
          tags: scan:${{ matrix.service }}
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan de vulnerabilidades (Trivy) - falha em CRITICAL com correção disponível
        uses:  aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: scan:${{ matrix.service }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagem
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: services
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # 4) Deploy em produção (somente main; "environment" permite exigir aprovação manual)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Configurar acesso ao cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Criar/atualizar Secret da aplicação (valores vêm do GitHub Secrets)
        run: |
          kubectl create namespace loja-veloz --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n loja-veloz create secret generic loja-veloz-secrets \
            --from-literal=POSTGRES_USER=veloz \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=DATABASE_URL="postgres://veloz:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/pedidos" \
            --from-literal=PAYMENT_PROVIDER_API_KEY="${{ secrets.PAYMENT_PROVIDER_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apontar imagens para o commit
        working-directory: k8s/overlays/prod
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"; TAG="sha-${GITHUB_SHA::7}"
          for s in gateway pedidos pagamentos estoque; do
            kustomize edit set image "loja-veloz/$s=ghcr.io/$OWNER/loja-veloz-$s:$TAG"
          done
      - name: Deploy (rolling update)
        run: kubectl apply -k k8s/overlays/prod
      - name: Aguardar rollout (rollback automático em falha)
        run: |
          for d in pedidos pagamentos estoque gateway; do
            kubectl -n loja-veloz rollout status deployment/$d --timeout=180s || {
              echo "::error::rollout de $d falhou - executando rollback"
              for x in gateway pedidos pagamentos estoque; do kubectl -n loja-veloz rollout undo deployment/$x || true; done
              exit 1
            }
          done
